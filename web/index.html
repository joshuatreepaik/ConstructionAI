<!doctype html>
<meta charset="utf-8">
<title>One-shot symbol finder</title>
<style>
  :root {
    --paper:#faf9f5; --panel:#f1efe8; --ink:#22303e; --muted:#5c6b7a;
    --line:#ddd9cf; --blue:#2e5f8a; --red:#c2402f; --orange:#d78327;
    --mono:ui-monospace,"SF Mono",Menlo,monospace;
  }
  body { margin:0; display:flex; height:100vh; color:var(--ink);
         font:13.5px/1.45 "Avenir Next","Helvetica Neue",system-ui,sans-serif;
         -webkit-user-select:none; user-select:none; }
  #side { width:300px; padding:16px 18px 28px; overflow-y:auto; flex-shrink:0;
          background:var(--paper); border-right:1px solid var(--line);
          box-sizing:border-box; }
  #titleblock { border:1.5px solid var(--ink); padding:10px 12px; margin-bottom:14px; }
  #titleblock h2 { margin:0; font-size:15px; letter-spacing:.01em; }
  #docname { font:10.5px var(--mono); color:var(--muted); word-break:break-all;
             margin-top:3px; }
  .eyebrow { font:10.5px var(--mono); letter-spacing:.13em; text-transform:uppercase;
             color:var(--blue); margin:16px 0 6px; }
  .sec { border-top:1px solid var(--line); margin-top:14px; }
  .hint { color:var(--muted); font-size:11.5px; }
  #status { color:var(--muted); font-size:11.5px; font-style:italic;
            min-height:16px; margin-top:8px; }
  select { width:100%; padding:5px 6px; font:12.5px var(--mono);
           color:var(--ink); background:#fff; border:1px solid var(--line);
           border-radius:0; margin:2px 0 6px; }
  input[type=file] { width:100%; font-size:11px; color:var(--muted); margin:4px 0 0; }
  input[type=checkbox], input[type=range] { accent-color:var(--blue); }
  label { display:block; margin:3px 0; }
  .sliderrow { display:flex; align-items:center; gap:8px; margin:5px 0; }
  .sliderrow .sl-label { flex:none; font-size:12px; }
  .sliderrow input { flex:1; min-width:0; }
  .sliderrow .sl-val { flex:none; font:11.5px var(--mono); color:var(--ink);
                       min-width:34px; text-align:right; }
  button { display:block; width:100%; margin:6px 0 0; padding:7px 10px;
           font:12.5px "Avenir Next","Helvetica Neue",system-ui,sans-serif;
           font-weight:600; color:var(--ink); text-align:left;
           background:var(--panel); border:1px solid var(--ink); border-radius:0;
           cursor:pointer; }
  button:hover { background:#e9e4d6; }
  button:active { transform:translateY(1px); }
  #count { display:flex; gap:18px; margin:10px 0 2px; }
  #count:empty { margin:0; }
  .countcell .num { font-size:30px; font-weight:700; line-height:1.1;
                    font-variant-numeric:tabular-nums; }
  .countcell .num.red { color:var(--red); }
  .countcell .num.orange { color:var(--orange); }
  .countcell .lab { font:10px var(--mono); letter-spacing:.1em;
                    text-transform:uppercase; color:var(--muted); }
  table.tbl { width:100%; border-collapse:collapse; margin-top:6px;
              font-size:12px; font-variant-numeric:tabular-nums; }
  .tbl th { text-align:left; font:10px var(--mono); letter-spacing:.09em;
            text-transform:uppercase; color:var(--muted); font-weight:500;
            padding:3px 8px 3px 0; border-bottom:1px solid var(--ink); }
  .tbl td { padding:3px 8px 3px 0; border-bottom:1px solid var(--line); }
  .tbl td.n, .tbl th.n { text-align:right; padding-right:2px; }
  .tbl td.n { font-weight:600; }
  .tbl tr.warn td { color:var(--orange); }
  .tbl tr.click { cursor:pointer; }
  .tbl tr.click:hover td { background:#f2efe6; }
  .tbl tr.sel td { background:#e4ecf4; }
  .ok { color:var(--blue); font-weight:700; }
  .recap { font-size:12.5px; margin-top:8px; }
  .recap b { font-variant-numeric:tabular-nums; }
  #wrap { flex:1; overflow:auto; position:relative; background:#8b9299; }
  #stage { position:relative; transform-origin:0 0; }
  #sheet { display:block; }
  #ovl { position:absolute; inset:0; cursor:crosshair; }
</style>
<div id="side">
  <div id="titleblock">
    <h2>One-shot symbol finder</h2>
    <div id="docname"></div>
  </div>
  <p class="hint" style="margin:0 0 4px">Drag a box around ONE symbol.
  Everything similar gets found: rotated, mirrored, resized, or partially
  covered. Tracing a door finds doors of every width.</p>

  <div class="eyebrow">Document</div>
  <select id="page"></select>
  <input type="file" id="file" accept="application/pdf">

  <div class="eyebrow">Search</div>
  <label><input type="checkbox" id="anysize" checked> match any size</label>
  <label><input type="checkbox" id="veto" checked> ignore text-labeled symbols</label>
  <div class="sliderrow" id="confwrap"><span class="sl-label">Confidence</span>
    <input type="range" id="conf" min="15" max="98" value="80">
    <span class="sl-val">≥<span id="confval">80</span>%</span></div>
  <div class="sliderrow"><span class="sl-label">Zoom</span>
    <input type="range" id="zoom" min="25" max="200" value="50">
    <span class="sl-val">%</span></div>
  <button id="legendBtn">⚡ Auto-count everything via legend</button>
  <button id="reconBtn" style="display:none">🧾 Cross-check vs panel schedules</button>
  <div id="status">draw a box, or hit auto-count</div>

  <div id="count"></div>
  <div id="stats"></div>
  <div id="recon"></div>
</div>
<div id="wrap"><div id="stage">
  <img id="sheet" draggable="false"><svg id="ovl"></svg>
</div></div>
<script>
const Z = __RENDER_ZOOM__;
const img = document.getElementById('sheet');
const ovl = document.getElementById('ovl');
const stage = document.getElementById('stage');
let dragging = null;

async function loadMeta(selectIndex) {
  const j = await (await fetch('/meta')).json();
  document.getElementById('docname').textContent = j.name || 'no document loaded';
  const sel = document.getElementById('page');
  sel.innerHTML = '';
  for (const p of j.pages) {
    const o = document.createElement('option');
    o.value = p.index; o.textContent = p.label;
    sel.appendChild(o);
  }
  if (j.pages.length) {
    sel.value = (selectIndex != null && j.pages.some(p => p.index == selectIndex))
      ? selectIndex : j.pages[0].index;
    loadPage();
  }
}
document.getElementById('file').onchange = async (e) => {
  const f = e.target.files[0];
  if (!f) return;
  document.getElementById('status').textContent = 'uploading + analyzing sheets…';
  const fd = new FormData();
  fd.append('file', f);
  const j = await (await fetch('/upload', {method: 'POST', body: fd})).json();
  if (j.error) { document.getElementById('status').textContent = j.error; return; }
  document.getElementById('status').textContent =
    (j.warning ? '⚠️ ' + j.warning : `loaded ${j.pages.length} sheets`);
  await loadMeta(null);
};

function loadPage() {
  img.src = '/page/' + document.getElementById('page').value + '.png';
  img.onload = () => {
    stage.style.width = img.naturalWidth + 'px';
    stage.style.height = img.naturalHeight + 'px';
    ovl.setAttribute('viewBox', `0 0 ${img.naturalWidth} ${img.naturalHeight}`);
    ovl.style.width = img.naturalWidth + 'px';
    ovl.style.height = img.naturalHeight + 'px';
    applyZoom();
  };
  ovl.innerHTML = '';
  document.getElementById('count').textContent = '';
  document.getElementById('stats').innerHTML = '';
}
function applyZoom() {
  stage.style.transform = 'scale(' + document.getElementById('zoom').value / 100 + ')';
}
document.getElementById('zoom').oninput = applyZoom;
document.getElementById('page').onchange = loadPage;

function evtPos(e) {
  const s = document.getElementById('zoom').value / 100;
  const r = stage.getBoundingClientRect();
  return [(e.clientX - r.left) / s, (e.clientY - r.top) / s];
}
ovl.onmousedown = e => { dragging = evtPos(e); e.preventDefault(); };
ovl.onmousemove = e => {
  if (!dragging) return;
  const [x1, y1] = evtPos(e);
  ovl.innerHTML = rubberSvg(dragging[0], dragging[1], x1, y1);
};
ovl.onmouseup = e => {
  if (!dragging) return;
  const [x1, y1] = evtPos(e);
  const box = [Math.min(dragging[0], x1) / Z, Math.min(dragging[1], y1) / Z,
               Math.max(dragging[0], x1) / Z, Math.max(dragging[1], y1) / Z];
  dragging = null;
  if ((box[2] - box[0]) < 2 || (box[3] - box[1]) < 2) return;
  runDetect(box);
};
function rubberSvg(x0, y0, x1, y1) {
  return `<rect x="${Math.min(x0,x1)}" y="${Math.min(y0,y1)}"
    width="${Math.abs(x1-x0)}" height="${Math.abs(y1-y0)}"
    fill="rgba(46,95,138,.14)" stroke="#2e5f8a" stroke-width="2"/>`;
}
async function runDetect(box) {
  document.getElementById('status').textContent = 'searching…';
  const res = await fetch('/detect', {
    method: 'POST', headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({
      page: document.getElementById('page').value, box: box,
      any_size: document.getElementById('anysize').checked,
      veto_text: document.getElementById('veto').checked,
      engine: 'v2' })
  });
  const j = await res.json();
  if (j.error) { document.getElementById('status').textContent = j.error; return; }
  // cross-check: symbols vs panel schedules, doors vs the other plan sheets
  lastBox = box;
  document.getElementById('recon').innerHTML = '';
  document.getElementById('reconBtn').style.display = '';
  document.getElementById('reconBtn').textContent = j.mode === 'door'
    ? '🚪 Cross-check vs the other sheets'
    : '🧾 Cross-check vs panel schedules';
  let st = `${j.elapsed}s · exemplar has ${j.n_exemplar_prims} primitives` +
    (j.n_traced_prims > j.n_exemplar_prims
      ? ` (${j.n_traced_prims - j.n_exemplar_prims} stray traced bits ignored)` : '');
  if (j.mode === 'door')
    st = `${j.elapsed}s · door recognized → parametric mode: finding doors of EVERY width`;
  else if (j.n_exemplar_prims <= 4)
    st += ' ⚠️ very generic shape — widen the box to include ticks/details';
  document.getElementById('status').textContent = st;
  lastV2 = j; renderV2();
}

// ---- v2 confidence slider: re-slices the stored response, no re-query ----
let lastV2 = null;
function renderV2() {
  if (!lastV2) return;
  const j = lastV2;
  const minConf = +document.getElementById('conf').value;
  const shown = j.detections.filter(d => d.confidence >= minConf);
  const confident = shown.filter(d => d.confidence >= j.conf_accept).length;
  const flagged = shown.length - confident;
  document.getElementById('count').innerHTML =
    `<div class="countcell"><div class="num red">${confident}</div>
       <div class="lab">confident</div></div>
     <div class="countcell"><div class="num orange">${flagged}</div>
       <div class="lab">flagged</div></div>`;
  const b = j.box_used;
  let svg = b ? rubberSvg(b[0]*Z, b[1]*Z, b[2]*Z, b[3]*Z) : '';
  for (const d of shown) {
    const pts = d.corners.map(c => (c[0]*Z) + ',' + (c[1]*Z)).join(' ');
    const col = d.confidence >= j.conf_accept ? '#e02020' : '#e08a00';
    const info = d.width ? `door ${d.width}` :
      `${d.theta_deg}° · ×${d.scale}${d.mirrored ? ' · mirrored' : ''}`;
    svg += `<polygon points="${pts}" fill="none" stroke="${col}" stroke-width="2.5">
      <title>${d.confidence}% · ${info}</title></polygon>`;
  }
  ovl.innerHTML = svg;
  const t = (o, head) => Object.keys(o || {}).length
    ? `<table class="tbl"><tr><th>${head}</th><th class="n">count</th></tr>` +
      Object.entries(o).map(([k, v]) =>
        `<tr><td>${k}</td><td class="n">${v}</td></tr>`).join('') + '</table>'
    : '';
  document.getElementById('stats').innerHTML =
    `<div class="hint">red = confident (≥${j.conf_accept}%) · orange = flagged ·
     drag the slider to reveal or hide uncertain hits</div>` +
    t(j.by_rotation, 'rotation') + t(j.by_scale, 'size');
}
document.getElementById('conf').oninput = () => {
  document.getElementById('confval').textContent =
    document.getElementById('conf').value;
  renderV2();
};

// ---- cross-check against the panel schedules -----------------------------
let lastBox = null;
document.getElementById('reconBtn').onclick = async () => {
  if (!lastBox) return;
  const out = document.getElementById('recon');
  out.innerHTML = '<div class="hint">reading the panel schedules…</div>';
  const res = await fetch('/reconcile', {
    method: 'POST', headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({ page: document.getElementById('page').value,
                           box: lastBox })
  });
  const j = await res.json();
  if (j.error) { out.innerHTML = `<div class="hint">${j.error}</div>`; return; }
  if (j.kind === 'doors') { renderDoorRecon(j); return; }
  const rows = j.rooms.map(r => {
    const ok = r.status === 'corroborated';
    const mark = ok ? '<span class="ok">✓</span>'
               : r.status === 'plan_only' ? 'plan only' : 'schedule only';
    return `<tr${ok ? '' : ' class="warn"'}>
     <td>${r.room}</td><td class="n">${r.symbols}</td><td class="n">${r.circuits}</td>
     <td title="${(r.circuit_text || []).join('\n').replace(/"/g,'&quot;')}">
       ${mark}</td></tr>`;
  }).join('');
  out.innerHTML =
    `<div class="eyebrow">Cross-check · panel schedules</div>
     <div class="recap"><b>${j.n_corroborated} rooms corroborated</b>
       (sheet p${j.schedule_page + 1}, ${j.n_circuits} circuits read)</div>
     <div class="hint">counted ${j.n_detections} same-size symbols ·
       ${j.n_excluded_scale} other-size set aside ·
       ${j.n_unattributed} outside tagged rooms ·
       hover a row for the circuit text</div>
     <table class="tbl"><tr><th>room</th><th class="n">plan</th>
       <th class="n">circuits</th><th>status</th></tr>${rows}</table>`;
};

function renderDoorRecon(j) {
  const out = document.getElementById('recon');
  const sheetRows = j.sheets.map(s =>
    `<tr><td>${s.sheet}</td><td class="n">${s.doors_there}</td>
     <td class="n">${s.matched}/${j.n_doors}</td></tr>`).join('');
  const flagged = j.n_doors - j.n_confirmed;
  out.innerHTML =
    `<div class="eyebrow">Cross-check · sibling sheets</div>
     <div class="recap"><b>${j.n_confirmed} of ${j.n_doors} doors confirmed</b>
       by other sheets drawing the same floor${flagged
         ? ` · <span style="color:var(--orange)">${flagged} on this sheet only</span>` : ''}</div>
     <div class="hint">sheets aligned by offset-voting on hinge positions ·
       unconfirmed doors are outlined in orange on the plan</div>
     <table class="tbl"><tr><th>sheet</th><th class="n">doors there</th>
       <th class="n">match</th></tr>${sheetRows}</table>`;
  // repaint overlay: unconfirmed doors in orange, width disagreements dashed
  let svg = '';
  for (const d of j.doors) {
    const pts = d.corners.map(c => (c[0]*Z) + ',' + (c[1]*Z)).join(' ');
    const ok = d.confirmed_on.length > 0;
    svg += `<polygon points="${pts}" fill="none"
      stroke="${ok ? '#e02020' : '#c47316'}" stroke-width="${ok ? 2.5 : 3.5}"
      ${d.width_disagrees ? 'stroke-dasharray="6,4"' : ''}>
      <title>door ${d.width} · ${ok
        ? 'also on ' + d.confirmed_on.join(', ')
        : 'THIS SHEET ONLY'}${d.width_disagrees ? ' · width disagrees!' : ''}</title>
      </polygon>`;
  }
  ovl.innerHTML = svg;
}

const PALETTE = ['#e02020','#1c7ed6','#0ca678','#f076b0','#7048e8','#e8590c',
                 '#0b7285','#9c36b5','#5c940d','#d6336c','#364fc7','#f59f00'];
let legendResults = null;
let legendSelected = null;

function legendSvg() {
  let svg = '';
  legendResults.forEach((r, i) => {
    if (legendSelected !== null && i !== legendSelected) return;
    const col = PALETTE[i % PALETTE.length];
    const wide = legendSelected === i ? 4 : 2.5;
    for (const d of r.detections) {
      const pts = d.corners.map(c => (c[0]*Z) + ',' + (c[1]*Z)).join(' ');
      svg += `<polygon points="${pts}" fill="none" stroke="${col}" stroke-width="${wide}">
        <title>${r.label} · score ${d.score} · ×${d.scale}</title></polygon>`;
    }
  });
  return svg;
}
function renderLegend() {
  ovl.innerHTML = legendSvg();
  const total = legendResults.reduce((a, r) => a + r.count, 0);
  const allSel = legendSelected === null;
  let rows = `<tr data-i="all" class="click${allSel ? ' sel' : ''}">
    <td class="n" style="font-weight:700">${total}</td><td><b>ALL SYMBOLS</b></td></tr>`;
  legendResults.forEach((r, i) => {
    const col = PALETTE[i % PALETTE.length];
    rows += `<tr data-i="${i}" class="click${legendSelected === i ? ' sel' : ''}">
      <td class="n" style="color:${col}">${r.count}</td>
      <td style="color:${col}">${r.label}</td></tr>`;
  });
  document.getElementById('stats').innerHTML =
    `<div class="hint">click a row to isolate that symbol · click again for all</div>
     <table class="tbl"><tr><th class="n">count</th><th>legend entry</th></tr>${rows}</table>`;
  document.querySelectorAll('#stats tr').forEach(tr => {
    tr.onclick = () => {
      const v = tr.getAttribute('data-i');
      legendSelected = (v === 'all' || legendSelected === +v) ? null : +v;
      renderLegend();
    };
  });
}
document.getElementById('legendBtn').onclick = async () => {
  document.getElementById('status').textContent =
    'harvesting legend sheets + counting every symbol… (~15-30s)';
  document.getElementById('count').textContent = '';
  document.getElementById('stats').innerHTML = '';
  const res = await fetch('/legend_count', {
    method: 'POST', headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({page: document.getElementById('page').value,
      engine: 'v2'})
  });
  const j = await res.json();
  if (j.error) { document.getElementById('status').textContent = j.error; return; }
  document.getElementById('status').textContent =
    `${j.elapsed}s · ${j.n_legend_symbols} legend symbols read · ${j.n_matched} found on this sheet`;
  legendResults = j.results;
  legendSelected = null;
  renderLegend();
};
loadMeta(null);
</script>
