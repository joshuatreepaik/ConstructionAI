<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 1014" width="880" height="1014" role="img" aria-label="The pipeline. A vector PDF is parsed once into a Sheet; a saliency index learns which fingerprints are rare on that sheet; three proposers emit one shared Candidate type; an evidence stage scores each against local clutter; a resolution stage arbitrates, names and scopes them; a decide stage outputs accept, review and reject with reasons; a final cross-check confirms the count against the drawing's own records, symbols against the OCR'd panel schedules and doors against the sibling sheets that redraw the same floor. A policy file feeds thresholds sideways, and an offline calibration loop sets the policy from measured score distributions.">
  <style>
    .stagebox { fill: #f1efe8; stroke: #22303e; stroke-width: 1.4; }
    .innerbox { fill: #ffffff; stroke: #22303e; stroke-width: 1.1; }
    .dashedbox { fill: none; stroke: #5c6b7a; stroke-width: 1.2; stroke-dasharray: 5 4; }
    .flow { stroke: #22303e; stroke-width: 1.3; fill: none; }
    .policyflow { stroke: #5c6b7a; stroke-width: 1.1; fill: none; stroke-dasharray: 4 4; }
    text { font-family: "Helvetica Neue", Helvetica, Arial, sans-serif; }
    .stagenum { font-family: "SF Mono", Menlo, Consolas, monospace; font-size: 11px; fill: #2e5f8a; letter-spacing: .1em; }
    .stagename { font-size: 14px; font-weight: 600; fill: #22303e; }
    .boxname { font-size: 12.5px; font-weight: 600; fill: #22303e; }
    .detail { font-size: 11.5px; fill: #5c6b7a; }
    .datalabel { font-family: "SF Mono", Menlo, Consolas, monospace; font-size: 11.5px; fill: #c2402f; }
    .sidenote { font-size: 10.5px; font-style: italic; fill: #c2402f; }
    .chiptext { font-size: 11px; fill: #ffffff; font-weight: 600; }
    .rejecttext { font-size: 11px; fill: #5c6b7a; }
  </style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#22303e"/>
    </marker>
    <marker id="am" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#5c6b7a"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="880" height="1014" fill="#faf9f5"/>
  <g transform="translate(10, 12)">

  <rect x="110" y="12" width="240" height="34" class="innerbox"/>
  <text x="230" y="34" text-anchor="middle" class="boxname">vector PDF drawing set</text>
  <line x1="230" y1="46" x2="230" y2="72" class="flow" marker-end="url(#a)"/>
  <text x="242" y="65" class="detail">parsed once per sheet</text>

  <rect x="110" y="76" width="510" height="70" class="stagebox"/>
  <text x="126" y="98" class="stagenum">STAGE 0</text>
  <text x="126" y="118" class="stagename">Sheet: read the drawing once</text>
  <text x="126" y="136" class="detail">primitives · words · zones · scale, all in one coordinate space</text>
  <line x1="230" y1="146" x2="230" y2="172" class="flow" marker-end="url(#a)"/>
  <text x="242" y="165" class="datalabel">Sheet</text>

  <rect x="110" y="176" width="510" height="70" class="stagebox"/>
  <text x="126" y="198" class="stagenum">STAGE 1</text>
  <text x="126" y="218" class="stagename">Saliency index: learn what is ordinary here</text>
  <text x="126" y="236" class="detail">rare fingerprints weigh more · hatching dropped entirely</text>
  <line x1="230" y1="246" x2="230" y2="272" class="flow" marker-end="url(#a)"/>
  <text x="242" y="265" class="detail">weighted fingerprint hits</text>

  <rect x="110" y="276" width="510" height="140" class="stagebox"/>
  <text x="126" y="298" class="stagenum">STAGE 2</text>
  <text x="126" y="318" class="stagename">Proposers: guess generously</text>
  <text x="95" y="344" text-anchor="end" class="sidenote">favor recall:</text>
  <text x="95" y="358" text-anchor="end" class="sidenote">a missed guess</text>
  <text x="95" y="372" text-anchor="end" class="sidenote">cannot be undone</text>

  <rect x="126" y="330" width="155" height="62" class="innerbox"/>
  <text x="203" y="356" text-anchor="middle" class="boxname">rigid</text>
  <text x="203" y="375" text-anchor="middle" class="detail">stamped symbols</text>

  <rect x="291" y="330" width="155" height="62" class="innerbox"/>
  <text x="368" y="356" text-anchor="middle" class="boxname">parametric</text>
  <text x="368" y="375" text-anchor="middle" class="detail">doors, any width</text>

  <rect x="456" y="330" width="154" height="62" class="dashedbox"/>
  <text x="533" y="356" text-anchor="middle" class="boxname">text-anchored</text>
  <text x="533" y="375" text-anchor="middle" class="detail">markers (planned)</text>

  <line x1="203" y1="392" x2="230" y2="404" class="flow"/>
  <line x1="368" y1="392" x2="230" y2="404" class="flow"/>
  <line x1="533" y1="392" x2="230" y2="404" class="flow"/>
  <line x1="230" y1="404" x2="230" y2="442" class="flow" marker-end="url(#a)"/>
  <text x="242" y="435" class="datalabel">Candidate, one shape for all three</text>

  <rect x="110" y="446" width="510" height="70" class="stagebox"/>
  <text x="126" y="468" class="stagenum">STAGE 3</text>
  <text x="126" y="488" class="stagename">Evidence: score against local clutter</text>
  <text x="126" y="506" class="detail">log-odds · a missing part costs evidence</text>
  <line x1="230" y1="516" x2="230" y2="542" class="flow" marker-end="url(#a)"/>
  <text x="242" y="535" class="datalabel">Candidate + Evidence</text>

  <rect x="110" y="546" width="510" height="108" class="stagebox"/>
  <text x="126" y="568" class="stagenum">STAGE 4</text>
  <text x="126" y="588" class="stagename">Resolution: arbitrate, name, scope</text>
  <text x="126" y="608" class="detail">① one spatial arbiter decides every overlap</text>
  <text x="126" y="625" class="detail">② semantic: nearby text names or disqualifies</text>
  <text x="126" y="642" class="detail">③ scope: legend, key plan, compass do not count</text>
  <line x1="230" y1="654" x2="230" y2="680" class="flow" marker-end="url(#a)"/>
  <text x="242" y="673" class="datalabel">Detection</text>

  <rect x="110" y="684" width="510" height="104" class="stagebox"/>
  <text x="126" y="706" class="stagenum">STAGE 5</text>
  <text x="126" y="726" class="stagename">Decide and report</text>
  <text x="95" y="712" text-anchor="end" class="sidenote">favor precision:</text>
  <text x="95" y="726" text-anchor="end" class="sidenote">a false accept</text>
  <text x="95" y="740" text-anchor="end" class="sidenote">costs money</text>
  <rect x="126" y="736" width="76" height="24" fill="#c2402f" rx="2"/>
  <text x="164" y="752" text-anchor="middle" class="chiptext">accept</text>
  <rect x="212" y="736" width="76" height="24" fill="#d78327" rx="2"/>
  <text x="250" y="752" text-anchor="middle" class="chiptext">review</text>
  <rect x="298" y="736" width="112" height="24" fill="none" stroke="#5c6b7a" stroke-width="1.1" rx="2"/>
  <text x="354" y="752" text-anchor="middle" class="rejecttext">reject + reason</text>
  <text x="126" y="778" class="detail">confidence slider re-slices this split live, with no re-query</text>
  <line x1="230" y1="788" x2="230" y2="814" class="flow" marker-end="url(#a)"/>
  <text x="242" y="807" class="datalabel">accepted + review counts</text>

  <rect x="110" y="818" width="510" height="116" class="stagebox"/>
  <text x="126" y="840" class="stagenum">CROSS-CHECK</text>
  <text x="126" y="860" class="stagename">The drawing confirms the count</text>
  <text x="95" y="856" text-anchor="end" class="sidenote">a wrong count that</text>
  <text x="95" y="870" text-anchor="end" class="sidenote">looks right is the</text>
  <text x="95" y="884" text-anchor="end" class="sidenote">expensive kind</text>

  <rect x="126" y="872" width="238" height="48" class="innerbox"/>
  <text x="245" y="892" text-anchor="middle" class="boxname">symbols vs panel schedules</text>
  <text x="245" y="909" text-anchor="middle" class="detail">tables OCR'd, agreement per room</text>

  <rect x="376" y="872" width="234" height="48" class="innerbox"/>
  <text x="493" y="892" text-anchor="middle" class="boxname">doors vs sibling sheets</text>
  <text x="493" y="909" text-anchor="middle" class="detail">hinges vote each sheet's offset</text>

  <line x1="230" y1="934" x2="230" y2="958" class="flow" marker-end="url(#a)"/>

  <rect x="110" y="962" width="510" height="38" class="innerbox"/>
  <text x="365" y="986" text-anchor="middle" class="boxname">count · review queue · corroborated / flagged · audit trail</text>

  <rect x="660" y="446" width="185" height="70" class="stagebox"/>
  <text x="676" y="468" class="stagenum">POLICY</text>
  <text x="676" y="488" class="detail">every threshold, one file,</text>
  <text x="676" y="504" class="detail">each with a written reason</text>
  <path d="M 660 462 L 644 462 L 644 211 L 626 211" class="policyflow" marker-end="url(#am)"/>
  <path d="M 660 481 L 626 481" class="policyflow" marker-end="url(#am)"/>
  <path d="M 660 498 L 636 498 L 636 600 L 626 600" class="policyflow" marker-end="url(#am)"/>
  <path d="M 660 510 L 630 510 L 630 726 L 626 726" class="policyflow" marker-end="url(#am)"/>

  <rect x="660" y="660" width="185" height="100" class="dashedbox"/>
  <text x="676" y="682" class="stagenum">CALIBRATION, OFFLINE</text>
  <text x="676" y="702" class="detail">run against blank regions</text>
  <text x="676" y="718" class="detail">and impossible templates</text>
  <text x="676" y="734" class="detail">for a measured noise floor</text>
  <line x1="790" y1="660" x2="790" y2="520" class="policyflow" marker-end="url(#am)"/>
  <text x="798" y="594" class="detail">sets</text>

  </g>
</svg>
